<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>duc</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng lông vũ rơi */
        .feather {
            position: absolute;
            color: #555;
            opacity: 0.3;
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* Khung chứa chính */
        .main-container {
            z-index: 10;
            width: 90%;
            max-width: 350px;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        /* Card chính */
        .card {
            background: #141416;
            border: 1px solid #27272a;
            border-radius: 24px;
            padding: 15px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Nút Loa */
        .music-btn {
            position: absolute;
            top: 15px;
            left: -25px;
            background: #18181b;
            border: 1px solid #27272a;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .music-btn:hover { background: #27272a; }
        .music-btn svg { width: 20px; fill: #ccc; }

        /* Phần Avatar và Tên */
        .profile-top {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            border: 1px solid #333;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 5px;
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #555;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
            line-height: 1;
        }

        .tick-icon { width: 16px; fill: #3b82f6; margin-left: 2px; }
        .heart-icon { font-size: 16px; margin-left: 2px; }

        .sub-text {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        /* Hàng Icon */
        .social-icons {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }
        .social-icons a {
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-icons a:hover { transform: scale(1.1); }
        .social-icons svg { width: 22px; height: 22px; fill: #fff; }

        /* Thanh thông tin dưới cùng */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #27272a;
            padding-top: 12px;
            font-size: 12px;
            color: #888;
            font-weight: 700;
        }

        .stat { display: flex; align-items: center; gap: 5px; }
        .stat svg { width: 14px; height: 14px; fill: #888; }

        /* Card phụ (Star Galaxy) */
        .server-card {
            background: #141416;
            border: 1px solid #27272a;
            border-radius: 24px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .server-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .server-name {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .server-stats {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: #888;
            font-weight: 700;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.online { background: #23a55a; }
        .dot.offline { background: #888; }

        .join-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 15px;
            border-radius: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .join-btn:hover { background: #fff; color: #000; }

        /* Link ẩn dưới đáy */
        .secret-link {
            position: absolute;
            bottom: 20px;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }
        .secret-box {
            background: #141416;
            padding: 12px 15px;
            border-radius: 15px;
            border: 1px solid #27272a;
            color: #666;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 90%;
            max-width: 350px;
            justify-content: space-between;
        }
        .secret-box span { font-weight: 600; }
        .secret-box svg { width: 20px; height: 20px; fill: #666; }
    </style>
</head>

    <script>
        // Hiệu ứng thời gian thực
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Hiệu ứng tạo lông vũ rơi
        function createFeather() {
            const container = document.getElementById('feathers-container');
            const feather = document.createElement('div');
            feather.classList.add('feather');
            feather.innerText = '🪶';
            
            feather.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 4 + 4;
            feather.style.animationDuration = duration + 's';
            feather.style.fontSize = (Math.random() * 10 + 15) + 'px';
            
            container.appendChild(feather);
            
            setTimeout(() => {
                feather.remove();
            }, duration * 1000);
        }
        
        setInterval(createFeather, 800);
    </script>
