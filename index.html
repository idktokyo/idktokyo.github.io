<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>duc</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng lông vũ rơi (Màu xám mờ) */
        .feather {
            position: absolute;
            font-size: 24px;
            color: #333;
            opacity: 0.5;
            animation: fall linear infinite;
            z-index: 1;
            transform-origin: center;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(20px); }
            100% { transform: translateY(110vh) rotate(360deg) translateX(-20px); }
        }

        /* Container chính */
        .main-container {
            z-index: 10;
            width: 100%;
            max-width: 380px;
            margin-top: 50px;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* Hiệu ứng viền kép cho thẻ Card */
        .card-wrapper {
            position: relative;
            border-radius: 28px;
            padding: 2px;
            background: #000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 28px;
            border: 1px solid #222;
            z-index: -1;
        }

        /* Tạo cái viền bóng mờ (Glow) phía sau */
        .card-wrapper::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: -5px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: -2;
        }

        /* Card chính */
        .card {
            background: #141416;
            border-radius: 26px;
            padding: 20px;
            position: relative;
            border: 1px solid #222;
        }

        /* Nút Loa (Lồi ra ngoài góc trái) */
        .music-btn {
            position: absolute;
            top: 20px;
            left: -28px;
            background: #0f0f11;
            border: 1px solid #222;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: 0.3s;
        }
        .music-btn:hover { background: #222; }
        .music-btn svg { width: 20px; fill: #fff; }

        /* Phần Avatar và Tên */
        .profile-top {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid #222;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-top: 10px;
        }

        .username {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #444; /* Chữ xám đậm như ảnh */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            line-height: 1;
        }

        .tick-icon { width: 18px; height: 18px; fill: #3b82f6; margin-left: 2px; }
        .heart-icon { font-size: 18px; margin-left: 2px; color: #ec4899; text-shadow: 0 0 5px #ec4899; }

        .sub-text {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            margin-left: 2px;
        }

        /* Hàng Icon */
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .social-icons a {
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-icons a:hover { transform: scale(1.1); }
        .social-icons svg { width: 24px; height: 24px; fill: #fff; }

        /* Thanh thông tin dưới cùng (có đường kẻ mờ) */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 15px;
            font-size: 13px;
            color: #888;
            font-weight: 700;
            margin-top: 10px;
        }

        .stat { display: flex; align-items: center; gap: 6px; }
        .stat svg { width: 16px; height: 16px; fill: #888; }
        
        /* Đường kẻ dọc giữa các stat */
        .divider {
            width: 1px;
            height: 15px;
            background: #333;
            margin: 0 5px;
        }

        /* Card Server Phụ */
        .server-card {
            background: #141416;
            border-radius: 26px;
            padding: 15px 20px;
            border: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-avatar {
            width: 55px;
            height: 55px;
            border-radius: 15px; /* Bo góc vuông */
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .server-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .server-name {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .server-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #888;
            font-weight: 700;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .dot.online { background: #23a55a; }
        .dot.offline { background: #888; }

        .join-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: 700;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .join-btn:hover { background: #fff; color: #000; }

        /* Card Nhỏ dưới cùng (User Idle) */
        .user-mini-card {
            background: #141416;
            border-radius: 20px;
            padding: 12px 15px;
            border: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .mini-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            position: relative;
        }
        .mini-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }
        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            background: #f59e0b; /* Màu vàng cam */
            border: 2px solid #141416;
            border-radius: 50%;
        }

        .mini-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .mini-name {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: #27272a;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mini-status {
            font-size: 13px;
            color: #aaa;
            font-weight: 600;
        }

        /* Nút Scroll xuống dưới cùng */
        .scroll-down {
            position: absolute;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            z-index: 10;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.3s;
        }
        .scroll-down:hover { opacity: 1; }
        
        /* Hình trái tim vẽ tay */
        .heart-draw {
            width: 30px;
            height: 30px;
            border: 2px solid #fff;
            border-radius: 50% 50% 0 0;
            transform: rotate(-45deg);
            position: relative;
        }
        .heart-draw::before, .heart-draw::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #fff;
            border-radius: 50%;
            top: -2px;
            left: -15px;
        }
        .heart-draw::after {
            left: 14px;
            top: 14px;
            transform: rotate(90deg);
        }
        
        /* Fix lại hình trái tim cho giống nét vẽ */
        .heart-icon-svg {
            width: 40px;
            height: 40px;
            stroke: #fff;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.8;
        }

    </style>
</head>

    <script>
        // Hiệu ứng thời gian thực
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Hiệu ứng tạo lông vũ rơi
        function createFeather() {
            const container = document.getElementById('feathers-container');
            const feather = document.createElement('div');
            feather.classList.add('feather');
            feather.innerText = '🪶';
            
            feather.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 4 + 4;
            feather.style.animationDuration = duration + 's';
            feather.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            container.appendChild(feather);
            
            setTimeout(() => {
                feather.remove();
            }, duration * 1000);
        }
        
        // Tạo lông vũ thường xuyên hơn một chút cho giống ảnh
        setInterval(createFeather, 600);
    </script>
